[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/mock_blend",
    "contracts/mock_slender",
    "contracts/sy_blend_wrapper",
    "contracts/sy_slender_wrapper",
    "contracts/pt_token",
    "contracts/yt_token",
    "contracts/yield_pool",
    "contracts/market_factory",
    "tests",
]

[workspace.dependencies]
soroban-sdk = "=28.0.0"
common = { path = "contracts/common" }
mock_blend = { path = "contracts/mock_blend" }
mock_slender = { path = "contracts/mock_slender" }
sy_blend_wrapper = { path = "contracts/sy_blend_wrapper" }
sy_slender_wrapper = { path = "contracts/sy_slender_wrapper" }
pt_token = { path = "contracts/pt_token" }
yt_token = { path = "contracts/yt_token" }
yield_pool = { path = "contracts/yield_pool" }
market_factory = { path = "contracts/market_factory" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
